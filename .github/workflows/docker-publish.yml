name: Build and Push to GHCR

# 手动触发构建，将 backend / frontend 镜像推送到 GitHub Container Registry
# 触发方式：仓库页面 Actions → 本工作流 → Run workflow → 填写版本号（必填）
#   - version       镜像版本号（必填，如 1.0.0），镜像标签即为该版本号
#   - update_latest 是否同时推送/更新 latest 标签（默认勾选）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（如 1.0.0）'
        required: true
        type: string
      update_latest:
        description: '同时更新 latest 标签'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::版本号只能包含字母、数字、点、下划线和连字符（如 1.0.0）"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.update_latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CI 环境网络可达官方代理，使用与本地默认（国内镜像优先）不同的源
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
